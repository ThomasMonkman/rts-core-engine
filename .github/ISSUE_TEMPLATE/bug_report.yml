name: Bug report
description: Report a reproducible problem in the engine.
title: "bug: "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: >-
        Please search existing issues before opening a new report. For gameplay or engine behavior, include the smallest reproduction you can.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the map, game mode, and actions needed to reproduce the issue.
      placeholder: |
        1. Start a session on ...
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Attach relevant logs, screenshots, traces, or a replay. For Lua failures, include the first error from `game.log` (`grep -n ERROR game.log`).
      render: text
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, architecture, build/commit, and game/FAF version where relevant.
      placeholder: |
        - OS and architecture:
        - engine version or commit:
        - Game / FAF version:
    validations:
      required: false
  - type: checkboxes
    id: determinism
    attributes:
      label: Determinism
      options:
        - label: This appears to be a cross-platform or lockstep determinism issue.
          required: false
