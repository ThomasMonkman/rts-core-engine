<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Lua API</title>
<!--
  The API browser. `--dump-api` writes this file with the API inlined in the
  `api-data` script below (src/lua_api/browser.rs); opened as it is in the
  repo, it fetches `api.json` from beside it instead.
  Libraries come from a CDN, pinned: Preact + htm (rendering), fuzzysort
  (search by name), MiniSearch (search in the docs), marked + DOMPurify (the
  `///` docs are Markdown).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0d151e;
  --panel: #131e2a;
  --raise: #1a2836;
  --line: #24364a;
  --text: #d9e3ec;
  --muted: #8a9db0;
  --accent: #62cfe6;
  --ok: #6fce7c;
  --partial: #e7b651;
  --stub: #ea6a5e;
  --internal: #6f8093;
  --mark: #e7b65133;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f8;
  --panel: #ffffff;
  --raise: #e9eef3;
  --line: #d3dce5;
  --text: #16222e;
  --muted: #5a6c7e;
  --accent: #0b7f9c;
  --ok: #24823a;
  --partial: #99680a;
  --stub: #c23b30;
  --internal: #74808c;
  --mark: #ffd97a66;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 1rem; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
code, pre { font-family: var(--mono); font-size: 0.92em; }

.app { display: grid; grid-template-columns: 19rem minmax(0, 1fr); min-height: 100vh; }

/* ---------------------------------------------------------------- sidebar */
.side { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.side-top { padding: 1rem 1rem 0.75rem; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.brand a { font: 600 1.15rem/1.2 var(--cond); color: var(--text); letter-spacing: 0.01em; }
.theme { color: var(--muted); font-size: 0.82rem; }
.theme:hover { color: var(--text); }
.vms { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 0.8rem 0 0.7rem; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.vms button { padding: 0.3rem 0; font: 500 0.9rem var(--cond); color: var(--muted); }
.vms button + button { border-left: 1px solid var(--line); }
.vms button[aria-pressed="true"] { background: var(--raise); color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.search { position: relative; }
.search input { width: 100%; padding: 0.45rem 2rem 0.45rem 0.6rem; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: 0.9rem var(--mono); }
.search input::placeholder { color: var(--muted); }
.search kbd { position: absolute; right: 0.5rem; top: 50%; translate: 0 -50%; font: 0.75rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 0.3rem; }
.side-body { overflow-y: auto; padding: 0.6rem 0 2rem; flex: 1; }
.nav-group { font: 600 0.82rem var(--cond); color: var(--muted); padding: 0.9rem 1rem 0.25rem; }
.nav a { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.14rem 1rem; color: var(--text); font: 0.86rem/1.5 var(--mono); border-left: 2px solid transparent; }
.nav a:hover { background: var(--raise); text-decoration: none; }
.nav a[aria-current="page"] { border-left-color: var(--accent); background: var(--raise); }
.nav a .n { color: var(--muted); font-size: 0.78rem; }
.nav a.plain { font-family: var(--sans); font-size: 0.9rem; }
.results a { display: block; padding: 0.28rem 1rem; color: var(--text); font: 0.86rem/1.4 var(--mono); border-left: 2px solid transparent; overflow-wrap: anywhere; }
.results a.sel { background: var(--raise); border-left-color: var(--accent); text-decoration: none; }
.results a:hover { text-decoration: none; background: var(--raise); }
.results b { color: var(--accent); font-weight: 600; }
.results .kind { color: var(--muted); font: 0.76rem var(--sans); margin-left: 0.5rem; }
.results .snip { display: block; color: var(--muted); font: 0.8rem/1.4 var(--sans); margin-top: 0.1rem; }
.results .snip b { color: var(--text); }
.results .none, .results .other { padding: 0.5rem 1rem; color: var(--muted); font-size: 0.86rem; }

/* ---------------------------------------------------------------- main */
main { padding: 2.2rem clamp(1rem, 4vw, 3.5rem) 6rem; max-width: 62rem; min-width: 0; }
h1 { font: 600 2.1rem/1.15 var(--cond); margin: 0 0 0.3rem; letter-spacing: 0.005em; }
h2 { font: 600 1.15rem/1.3 var(--cond); margin: 2.6rem 0 0.4rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 0.6rem; }
h2 .n { color: var(--muted); font: 0.82rem var(--mono); }
.lede { color: var(--muted); margin: 0 0 1rem; max-width: 46rem; }
.lede code, .lede a { font-family: var(--mono); font-size: 0.9em; }
.doc { max-width: 46rem; }
.doc p { margin: 0.35rem 0; }
.doc code { background: var(--raise); padding: 0.05em 0.3em; border-radius: 3px; }
.doc pre { background: var(--raise); padding: 0.6rem 0.8rem; border-radius: 4px; overflow-x: auto; }
.doc pre code { background: none; padding: 0; }
.doc ul { margin: 0.3rem 0; padding-left: 1.2rem; }

.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raise); }
.bar i { display: block; }
.bar .implemented { background: var(--ok); }
.bar .partial { background: var(--partial); }
.bar .stub { background: var(--stub); }
.bar .internal { background: var(--internal); }

.filters { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin: 1.1rem 0 0; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.16rem 0.6rem; border: 1px solid var(--line); border-radius: 999px; font-size: 0.84rem; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--text); background: var(--raise); }
.chip .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: currentColor; opacity: 0.35; }
.chip[aria-pressed="true"] .dot { opacity: 1; }
.dot.implemented { color: var(--ok); } .dot.partial { color: var(--partial); } .dot.stub { color: var(--stub); } .dot.internal { color: var(--internal); }
.chip .n { font: 0.76rem var(--mono); color: var(--muted); }

/* A member: the bar at its left edge is its status (none: implemented). */
.member { position: relative; padding: 0.75rem 0 0.8rem 1rem; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; margin-left: -1rem; }
.member.stub { border-left-color: var(--stub); }
.member.partial { border-left-color: var(--partial); }
.member.internal { border-left-color: var(--internal); }
.member:target, .member.target { background: var(--mark); }
.sig { font: 0.92rem/1.55 var(--mono); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.sig .name { font-weight: 600; color: var(--text); }
.sig .name:hover { color: var(--accent); }
.sig .p { color: var(--muted); }
.sig .recv { color: var(--muted); }
.sig .or { color: var(--muted); font: 0.8rem var(--sans); }
.meta { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; margin-top: 0.3rem; font-size: 0.82rem; color: var(--muted); }
.meta a { color: var(--muted); font-family: var(--mono); font-size: 0.78rem; }
.meta a:hover { color: var(--accent); }
.tag { font-weight: 500; }
.tag.stub { color: var(--stub); } .tag.partial { color: var(--partial); } .tag.internal { color: var(--internal); }
.copy { color: var(--muted); font-size: 0.8rem; }
.copy:hover { color: var(--accent); }
.empty { color: var(--muted); padding: 1rem 0; }

details.inherited { margin-top: 0.4rem; border-bottom: 1px solid var(--line); }
details.inherited > summary { cursor: pointer; padding: 0.55rem 0; font: 500 0.95rem var(--cond); color: var(--muted); }
details.inherited > summary:hover { color: var(--text); }
details.inherited[open] > summary { color: var(--text); }
details.inherited .member:last-child { border-bottom: 0; }

table { border-collapse: collapse; width: 100%; }
th { text-align: left; font: 600 0.82rem var(--cond); color: var(--muted); padding: 0.3rem 0.8rem 0.3rem 0; border-bottom: 1px solid var(--line); }
td { padding: 0.32rem 0.8rem 0.32rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font: 0.84rem var(--mono); white-space: nowrap; }
td.name { font: 0.9rem var(--mono); white-space: nowrap; }
td.barcell { width: 40%; min-width: 7rem; vertical-align: middle; }
.cover-key { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0.8rem 0 0.6rem; font-size: 0.84rem; color: var(--muted); }
.cover-key span { display: inline-flex; align-items: center; gap: 0.4rem; }
.cover-key .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: currentColor; }
.usedby { columns: 2 18rem; column-gap: 2rem; font: 0.86rem/1.7 var(--mono); padding: 0; margin: 0.6rem 0; list-style: none; }
.variants { font: 0.9rem/1.9 var(--mono); }
.variants code { background: var(--raise); padding: 0.1em 0.4em; border-radius: 3px; margin-right: 0.35rem; }
.fatal { padding: 3rem; max-width: 40rem; }
.menu { display: none; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; }
  .side-body { display: none; max-height: 60vh; }
  .side.open .side-body, .side.searching .side-body { display: block; }
  .menu { display: inline; color: var(--accent); font-size: 0.85rem; margin-top: 0.6rem; }
  main { padding-top: 1.4rem; }
  h1 { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .member.target { animation: land 1.6s ease-out; }
  @keyframes land { from { background: var(--mark); } to { background: transparent; } }
}
</style>
</head>
<body>
<div id="app"><p class="fatal">Loading the API…</p></div>
<script id="api-data" type="application/json">/*API_DATA*/null</script>
<script type="module">
const fail = (what) => {
  document.getElementById('app').innerHTML = `<p class="fatal">${what}</p>`;
};

let lib;
try {
  const [p, fz, mk, dp, ms] = await Promise.all([
    import('https://esm.sh/htm@3.1.1/preact/standalone'),
    import('https://esm.sh/fuzzysort@3.1.0'),
    import('https://esm.sh/marked@15.0.12'),
    import('https://esm.sh/dompurify@3.2.6'),
    import('https://esm.sh/minisearch@7.1.2'),
  ]);
  lib = { ...p, fuzzysort: fz.default, marked: mk.marked, purify: dp.default, MiniSearch: ms.default };
} catch (e) {
  fail('The page’s libraries could not be loaded from esm.sh (it needs a network connection). The same API is in <code>api.json</code>, <code>sim.d.luau</code> and <code>user.d.luau</code> beside this file.');
  throw e;
}
const { html, render, useState, useEffect, useMemo, useRef, fuzzysort, marked, purify, MiniSearch } = lib;

async function loadData() {
  const inline = document.getElementById('api-data').textContent;
  if (!inline.startsWith('/*')) return JSON.parse(inline);
  const r = await fetch('api.json');
  if (!r.ok) throw new Error(`api.json: ${r.status}`);
  return r.json();
}
let DATA;
try {
  DATA = await loadData();
} catch (e) {
  fail('No API data here. Generate the page with <code>cargo run -- --dump-api docs/api</code> and open <code>docs/api/index.html</code>.');
  throw e;
}

// ------------------------------------------------------------------ model

const STATUSES = ['implemented', 'partial', 'stub', 'internal'];
const STATUS_LABEL = { implemented: 'Implemented', partial: 'Partly implemented', stub: 'Not implemented yet', internal: 'Engine-internal' };
const WORD = /[A-Za-z_][A-Za-z0-9_]*/g;

/// Everything a VM has, indexed for the page: `entries` (what search finds),
/// `names` (type and class names -> link), `usedBy` (name -> entries whose
/// signature mentions it), `byLabel` (for links in docs).
function index(vm) {
  const at = (scope, member) => `#${vm.name}/${scope}${member ? '/' + member : ''}`;
  const entries = [];
  const names = new Map();
  const usedBy = new Map();
  const uses = (entry, types) => {
    const seen = new Set();
    for (const t of types) for (const w of t.match(WORD) || []) seen.add(w);
    for (const w of seen) {
      if (!usedBy.has(w)) usedBy.set(w, []);
      usedBy.get(w).push(entry);
    }
  };
  const sigTypes = (f) => [f, ...(f.overloads || [])].flatMap((s) => [...s.params.map((p) => p.type), ...(s.returns || [])]);
  const fn = (f, scope, label, kind) => {
    const e = { kind, label, name: f.name, href: at(scope, f.name), doc: [f.doc, f.note].filter(Boolean).join(' ') };
    entries.push(e);
    uses(e, sigTypes(f));
  };
  for (const c of vm.classes) {
    names.set(c.name, at(c.name));
    entries.push({ kind: 'class', label: c.name, name: c.name, href: at(c.name) });
    for (const f of c.methods) fn(f, c.name, `${c.name}:${f.name}`, 'method');
    for (const cb of c.callbacks) {
      const e = { kind: 'callback', label: `${c.name}:${cb.name}`, name: cb.name, href: at(c.name, 'on.' + cb.name), doc: cb.doc };
      entries.push(e);
      uses(e, cb.params.map((p) => p.type));
    }
  }
  for (const t of vm.tables) for (const f of t.functions) fn(f, t.name, `${t.name}.${f.name}`, 'function');
  for (const f of vm.globals) fn(f, 'globals', f.name, 'global');
  for (const t of vm.types) {
    names.set(t.name, at('types', t.name));
    const e = { kind: 'type', label: t.name, name: t.name, href: at('types', t.name), doc: [t.doc, ...(t.fields || []).map((f) => f.doc)].filter(Boolean).join(' ') };
    entries.push(e);
    uses(e, [t.type || '', ...(t.fields || []).map((f) => f.type)]);
  }
  const byLabel = new Map(entries.map((e) => [e.label, e.href]));
  const classes = new Map(vm.classes.map((c) => [c.name, c]));
  // What the docs say, for search (built the first time it's needed).
  let text;
  const docs = () => {
    if (!text) {
      text = new MiniSearch({ fields: ['doc'], idField: 'i', searchOptions: { prefix: true, fuzzy: 0.15, combineWith: 'AND' } });
      text.addAll(entries.map((e, i) => ({ i, doc: e.doc || '' })).filter((d) => d.doc));
    }
    return text;
  };
  return { vm, entries, names, usedBy, byLabel, classes, at, docs };
}
const VMS = new Map(DATA.vms.map((vm) => [vm.name, index(vm)]));
const VM_NAMES = [...VMS.keys()];

const count = (fns) => {
  const n = { implemented: 0, partial: 0, stub: 0, internal: 0, total: fns.length, undocumented: 0 };
  for (const f of fns) {
    n[f.status]++;
    if (!f.doc && f.status !== 'internal') n.undocumented++;
  }
  return n;
};
const allFns = (vm) => [...vm.classes.flatMap((c) => c.methods), ...vm.tables.flatMap((t) => t.functions), ...vm.globals];

function sourceUrl(src) {
  if (!DATA.repository || !src) return null;
  const rev = !DATA.commit || DATA.commit === 'nogit' ? 'develop' : DATA.commit;
  return `${DATA.repository}/blob/${rev}/${src.file}#L${src.line}`;
}

// ------------------------------------------------------------------ pieces

const docCache = new Map();
/// A `///` doc as HTML: Markdown, with `Name` / `Class:Method` in backticks
/// linked when this VM has them.
function docHtml(ix, doc) {
  const key = ix.vm.name + '\0' + doc;
  if (!docCache.has(key)) {
    let h = purify.sanitize(marked.parse(doc));
    h = h.replace(/<code>([A-Za-z_][\w.:]*)(\(\))?<\/code>/g, (all, name, call) => {
      const href = ix.byLabel.get(name);
      return href ? `<a href="${href}"><code>${name}${call || ''}</code></a>` : all;
    });
    docCache.set(key, h);
  }
  return docCache.get(key);
}
const Doc = ({ ix, text }) => (text ? html`<div class="doc" dangerouslySetInnerHTML=${{ __html: docHtml(ix, text) }} />` : null);

/// A type as the definitions spell it, with the names this VM has linked.
function Type({ ix, t }) {
  const out = [];
  let last = 0;
  for (const m of t.matchAll(WORD)) {
    const href = ix.names.get(m[0]);
    if (!href) continue;
    out.push(t.slice(last, m.index), html`<a href=${href}>${m[0]}</a>`);
    last = m.index + m[0].length;
  }
  out.push(t.slice(last));
  return out;
}

function Params({ ix, params, wrap }) {
  const sep = wrap ? ',\n    ' : ', ';
  return html`<span class="p">(</span>${wrap ? '\n    ' : ''}${params.map(
    (p, i) => html`${i ? sep : ''}${p.name === '...' ? '...' : p.name}<span class="p">: </span><${Type} ix=${ix} t=${p.type} />`,
  )}${wrap ? '\n' : ''}<span class="p">)</span>`;
}
function Returns({ ix, returns }) {
  if (!returns) return null;
  const body = returns.length === 0 ? '()' : returns.map((r, i) => html`${i ? ', ' : ''}<${Type} ix=${ix} t=${r} />`);
  return html`<span class="p">: </span>${returns.length > 1 ? html`(${body})` : body}`;
}
const sigLength = (name, s) => name.length + s.params.reduce((n, p) => n + p.name.length + p.type.length + 4, 0) + (s.returns || []).join(', ').length;

function Signature({ ix, recv, name, href, sig }) {
  const wrap = sigLength(recv + name, sig) > 84 && sig.params.length > 1;
  return html`<span class="recv">${recv}</span><a class="name" href=${href}>${name}</a><${Params} ix=${ix} params=${sig.params} wrap=${wrap} /><${Returns} ix=${ix} returns=${sig.returns} />`;
}

function CopyLink({ href }) {
  const [done, setDone] = useState(false);
  const copy = async () => {
    await navigator.clipboard.writeText(location.href.split('#')[0] + href);
    setDone(true);
    setTimeout(() => setDone(false), 1200);
  };
  return html`<button class="copy" onClick=${copy}>${done ? 'Link copied' : 'Copy link'}</button>`;
}

/// One function, method or callback.
function Member({ ix, id, recv, href, item, status, target }) {
  const other = VM_NAMES.filter((n) => n !== ix.vm.name && VMS.get(n).byLabel.has(labelOf(href)));
  const url = sourceUrl(item.src);
  return html`<div class=${`member ${status || ''} ${target ? 'target' : ''}`} id=${id}>
    <pre class="sig"><${Signature} ix=${ix} recv=${recv} name=${item.name} href=${href} sig=${item} />${(item.overloads || []).map(
      (o) => html`${'\n'}<span class="or">or </span><${Signature} ix=${ix} recv=${recv} name=${item.name} href=${href} sig=${o} />`,
    )}</pre>
    <${Doc} ix=${ix} text=${item.doc} />
    <div class="meta">
      ${status && status !== 'implemented' && html`<span class=${`tag ${status}`}>${STATUS_LABEL[status]}${item.note ? `: ${item.note}` : ''}</span>`}
      ${other.map((n) => html`<a href=${href.replace('#' + ix.vm.name, '#' + n)}>also in ${n}</a>`)}
      ${url && html`<a href=${url} target="_blank" rel="noopener">${item.src.file}:${item.src.line}</a>`}
      <${CopyLink} href=${href} />
    </div>
  </div>`;
}
// `#sim/Unit/Name` -> `Unit:Name`, as `index` labels entries.
function labelOf(href) {
  const [, scope, member] = href.slice(1).split('/');
  if (!member) return scope;
  if (scope === 'globals' || scope === 'types') return member;
  return `${scope}${/^[a-z]/.test(scope) ? '.' : ':'}${member.replace(/^on\./, '')}`;
}

function Bar({ n }) {
  return html`<div class="bar" title=${STATUSES.filter((s) => n[s]).map((s) => `${n[s]} ${STATUS_LABEL[s].toLowerCase()}`).join(', ')}>
    ${STATUSES.map((s) => n[s] > 0 && html`<i class=${s} style=${{ flex: n[s] }} />`)}
  </div>`;
}

function Filters({ n, show, setShow, undocumented, setUndocumented }) {
  const toggle = (s) => setShow({ ...show, [s]: !show[s] });
  return html`<div class="filters">
    ${STATUSES.filter((s) => n[s]).map(
      (s) => html`<button class="chip" aria-pressed=${String(!!show[s])} onClick=${() => toggle(s)}>
        <span class=${`dot ${s}`} />${STATUS_LABEL[s]}<span class="n">${n[s]}</span>
      </button>`,
    )}
    ${n.undocumented > 0 &&
    html`<button class="chip" aria-pressed=${String(undocumented)} onClick=${() => setUndocumented(!undocumented)}>
      Only undocumented<span class="n">${n.undocumented}</span>
    </button>`}
  </div>`;
}

function FnList({ ix, fns, scope, recv, view, member }) {
  const shown = fns.filter((f) => view.show[f.status] && (!view.undocumented || !f.doc));
  if (!shown.length) return html`<p class="empty">${fns.length ? 'Nothing matches the filters above.' : 'None.'}</p>`;
  return shown.map((f) => html`<${Member} key=${f.name} ix=${ix} id=${f.name} recv=${recv} href=${ix.at(scope, f.name)} item=${f} status=${f.status} target=${member === f.name} />`);
}

function UsedBy({ ix, name }) {
  const list = (ix.usedBy.get(name) || []).filter((e) => e.label !== name);
  if (!list.length) return null;
  return html`<h2>Used by <span class="n">${list.length}</span></h2>
    <ul class="usedby">${list.map((e) => html`<li><a href=${e.href}>${e.label}</a></li>`)}</ul>`;
}

// ------------------------------------------------------------------ pages

function Overview({ ix }) {
  const vm = ix.vm;
  const total = count(allFns(vm));
  const rows = [
    { name: 'Globals', href: ix.at('globals'), n: count(vm.globals) },
    ...vm.tables.map((t) => ({ name: t.name, href: ix.at(t.name), n: count(t.functions) })),
    ...vm.classes.map((c) => ({ name: c.name, href: ix.at(c.name), n: count(c.methods) })),
  ]
    .filter((r) => r.n.total)
    .sort((a, b) => b.n.total - a.n.total);
  const callbacks = vm.classes.reduce((n, c) => n + c.callbacks.length, 0);
  const done = Math.round((100 * (total.implemented + total.partial)) / (total.total - total.internal || 1));
  return html`
    <h1>Engine Lua API</h1>
    <p class="lede">
      What the engine gives the ${vm.name === 'sim' ? 'simulation' : 'interface'} scripts: ${total.total} functions in ${vm.classes.length} classes${callbacks ? `, and ${callbacks} callbacks it calls back` : ''}. ${done}% of them work today. Built from engine ${DATA.engine} at ${DATA.commit}.
    </p>
    <p class="lede">
      For your editor: <a href=${`${vm.name}.d.luau`}>${vm.name}.d.luau</a> (luau-lsp) or <a href=${`${vm.name}.lua`}>${vm.name}.lua</a> (lua-language-server). The same data for tools: <a href="api.json">api.json</a>.
    </p>
    <h2>How much works</h2>
    <div class="cover-key">${STATUSES.filter((s) => total[s]).map((s) => html`<span><i class=${`dot ${s}`} />${total[s]} ${STATUS_LABEL[s].toLowerCase()}</span>`)}</div>
    <table>
      <thead><tr><th>Where</th><th></th><th class="num">Working</th><th class="num">No doc</th></tr></thead>
      <tbody>
        ${rows.map(
          (r) => html`<tr>
            <td class="name"><a href=${r.href}>${r.name}</a></td>
            <td class="barcell"><${Bar} n=${r.n} /></td>
            <td class="num">${r.n.implemented + r.n.partial} / ${r.n.total - r.n.internal}</td>
            <td class="num">${r.n.undocumented || ''}</td>
          </tr>`,
        )}
      </tbody>
    </table>`;
}

function useView() {
  const [show, setShow] = useState({ implemented: true, partial: true, stub: true, internal: false });
  const [undocumented, setUndocumented] = useState(false);
  return { show, setShow, undocumented, setUndocumented };
}
/// A linked member the filters would hide is shown anyway.
function reveal(view, fns, member) {
  const f = fns.find((f) => f.name === member);
  if (!f) return view;
  return { ...view, show: { ...view.show, [f.status]: true }, undocumented: view.undocumented && !f.doc };
}

function ClassPage({ ix, cls, member, view }) {
  const n = count(cls.methods);
  const chain = [];
  for (let c = cls; c.bases.length && ix.classes.has(c.bases[0]); ) chain.push((c = ix.classes.get(c.bases[0])));
  const subs = ix.vm.classes.filter((c) => c.bases.includes(cls.name));
  const v = reveal(view, cls.methods, member);
  return html`
    <h1>${cls.name}</h1>
    <p class="lede">
      <code>moho.${cls.moho}</code>
      ${chain.length > 0 && html`, extends ${chain.map((c, i) => html`${i ? ', ' : ''}<a href=${ix.at(c.name)}>${c.name}</a>`)}`}
      ${subs.length > 0 && html`. Extended by ${subs.map((c, i) => html`${i ? ', ' : ''}<a href=${ix.at(c.name)}>${c.name}</a>`)}`}
    </p>
    ${n.total > 0 && html`<${Bar} n=${n} />`}
    <${Filters} n=${n} ...${view} />
    <h2>Methods <span class="n">${cls.methods.length}</span></h2>
    <${FnList} ix=${ix} fns=${cls.methods} scope=${cls.name} recv=${cls.name + ':'} view=${v} member=${member} />
    ${chain.map(
      (base) => html`<details class="inherited" key=${base.name}>
        <summary>${base.methods.length} more from ${base.name}</summary>
        <${FnList} ix=${ix} fns=${base.methods} scope=${base.name} recv=${base.name + ':'} view=${view} />
      </details>`,
    )}
    ${cls.callbacks.length > 0 &&
    html`<h2>Callbacks <span class="n">${cls.callbacks.length}</span></h2>
      <p class="lede">The engine calls these on a ${cls.name}’s script object, if the script defines them.</p>
      ${cls.callbacks.map((cb) => html`<${Member} key=${cb.name} ix=${ix} id=${'on.' + cb.name} recv=${cls.name + ':'} href=${ix.at(cls.name, 'on.' + cb.name)} item=${cb} target=${member === 'on.' + cb.name} />`)}`}
    <${UsedBy} ix=${ix} name=${cls.name} />`;
}

function FnPage({ ix, title, lede, fns, scope, recv, member, view }) {
  const n = count(fns);
  return html`
    <h1>${title}</h1>
    <p class="lede">${lede}</p>
    <${Bar} n=${n} />
    <${Filters} n=${n} ...${view} />
    <h2>Functions <span class="n">${fns.length}</span></h2>
    <${FnList} ix=${ix} fns=${fns} scope=${scope} recv=${recv} view=${reveal(view, fns, member)} member=${member} />`;
}

function TypeBody({ ix, t }) {
  if (t.kind === 'enum') return html`<p class="variants">One of ${t.variants.map((v) => html`<code>"${v}"</code>`)}</p>`;
  if (t.kind === 'opaque') return html`<p class="lede">An engine handle: scripts only pass it back to the engine.</p>`;
  if (t.kind === 'alias') return html`<pre class="sig">${t.name} = <${Type} ix=${ix} t=${t.type} /></pre>`;
  return html`<table>
    <thead><tr><th>Key</th><th>Type</th><th></th></tr></thead>
    <tbody>${t.fields.map((f) => html`<tr><td class="name">${f.key}</td><td class="name" style="white-space: normal"><${Type} ix=${ix} t=${f.type} /></td><td><${Doc} ix=${ix} text=${f.doc} /></td></tr>`)}</tbody>
  </table>`;
}
const KIND = { enum: 'A string, one of a fixed set', struct: 'A table with these keys', alias: 'A shape scripts share', opaque: 'An opaque handle' };

function TypePage({ ix, t }) {
  const url = sourceUrl(t.src);
  return html`
    <h1>${t.name}</h1>
    <p class="lede">${KIND[t.kind]}. ${url && html`<a href=${url} target="_blank" rel="noopener">${t.src.file}:${t.src.line}</a>`}</p>
    <${Doc} ix=${ix} text=${t.doc} />
    <${TypeBody} ix=${ix} t=${t} />
    <${UsedBy} ix=${ix} name=${t.name} />`;
}

function TypesPage({ ix }) {
  return html`
    <h1>Types</h1>
    <p class="lede">Tables, enums and shapes the functions take and return.</p>
    <table>
      <tbody>${ix.vm.types.map((t) => html`<tr><td class="name"><a href=${ix.at('types', t.name)}>${t.name}</a></td><td>${(t.doc || KIND[t.kind]).split('\n')[0]}</td></tr>`)}</tbody>
    </table>`;
}

function Page({ ix, scope, member }) {
  const view = useView();
  const vm = ix.vm;
  if (!scope) return html`<${Overview} ix=${ix} />`;
  if (scope === 'globals')
    return html`<${FnPage} ix=${ix} title="Globals" lede="Functions any script can call by name." fns=${vm.globals} scope="globals" recv="" member=${member} view=${view} />`;
  if (scope === 'types') {
    const t = vm.types.find((t) => t.name === member);
    return t ? html`<${TypePage} ix=${ix} t=${t} />` : html`<${TypesPage} ix=${ix} />`;
  }
  const cls = ix.classes.get(scope);
  if (cls) return html`<${ClassPage} ix=${ix} cls=${cls} member=${member} view=${view} />`;
  const table = vm.tables.find((t) => t.name === scope);
  if (table)
    return html`<${FnPage} ix=${ix} title=${table.name} lede=${html`Functions in the global table <code>${table.name}</code>.`} fns=${table.functions} scope=${table.name} recv=${table.name + '.'} member=${member} view=${view} />`;
  const elsewhere = VM_NAMES.filter((n) => n !== vm.name && (VMS.get(n).classes.has(scope) || VMS.get(n).vm.tables.some((t) => t.name === scope)));
  return html`<h1>Not in the ${vm.name} VM</h1>
    <p class="lede">
      There is no <code>${scope}</code> here.
      ${elsewhere.map((n) => html` It exists in <a href=${`#${n}/${scope}${member ? '/' + member : ''}`}>the ${n} VM</a>.`)}
      ${' '}<a href=${ix.at('')}>See everything in ${vm.name}</a>.
    </p>`;
}

// ------------------------------------------------------------------ sidebar

function Nav({ ix, scope }) {
  const vm = ix.vm;
  const cur = (s) => (scope === s ? 'page' : undefined);
  // Classes as a tree: a class sits under its base.
  const rows = [];
  const walk = (c, depth) => {
    rows.push({ c, depth });
    for (const sub of vm.classes) if (sub.bases[0] === c.name) walk(sub, depth + 1);
  };
  for (const c of [...vm.classes].sort((a, b) => a.name.localeCompare(b.name))) if (!c.bases.length || !ix.classes.has(c.bases[0])) walk(c, 0);
  return html`<nav class="nav">
    <a class="plain" href=${`#${vm.name}`} aria-current=${cur(undefined)}>Overview</a>
    <a class="plain" href=${ix.at('globals')} aria-current=${cur('globals')}>Globals <span class="n">${vm.globals.length}</span></a>
    <a class="plain" href=${ix.at('types')} aria-current=${cur('types')}>Types <span class="n">${vm.types.length}</span></a>
    <div class="nav-group">Classes</div>
    ${rows.map(({ c, depth }) => html`<a href=${ix.at(c.name)} aria-current=${cur(c.name)} style=${{ paddingLeft: `${1 + depth * 0.9}rem` }}>${c.name}<span class="n">${c.methods.length || ''}</span></a>`)}
    ${vm.tables.length > 0 && html`<div class="nav-group">Tables</div>`}
    ${vm.tables.map((t) => html`<a href=${ix.at(t.name)} aria-current=${cur(t.name)}>${t.name}<span class="n">${t.functions.length}</span></a>`)}
  </nav>`;
}

const KIND_LABEL = { class: 'class', type: 'type', callback: 'callback', method: '', global: '', function: '' };

/// The part of `doc` around the first word the search matched, with the
/// matched words marked.
function Snippet({ doc, terms }) {
  const plain = doc.replace(/\s+/g, ' ');
  const words = [...new Set(terms)].sort((a, b) => b.length - a.length).map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!words.length) return plain.slice(0, 110);
  const re = new RegExp(`\\b(${words.join('|')})`, 'gi');
  const first = plain.search(re);
  const from = Math.max(0, first - 40);
  const cut = plain.slice(from, from + 130);
  const out = [];
  let last = 0;
  for (const m of cut.matchAll(re)) {
    out.push(cut.slice(last, m.index), html`<b>${m[0]}</b>`);
    last = m.index + m[0].length;
  }
  out.push(cut.slice(last));
  return html`${from > 0 ? '…' : ''}${out}${from + 130 < plain.length ? '…' : ''}`;
}

/// Names first (fuzzy), then what the docs say (whole words, any order).
function Results({ ix, query, sel, setCount, onPick }) {
  const { named, inDocs } = useMemo(() => {
    const named = fuzzysort.go(query, ix.entries, { key: 'label', limit: 40, threshold: 0.5 });
    const have = new Set(named.map((r) => r.obj));
    const inDocs = query.length < 3 ? [] : ix.docs().search(query).map((r) => ({ obj: ix.entries[r.id], terms: r.terms })).filter((r) => !have.has(r.obj)).slice(0, 40);
    return { named, inDocs };
  }, [ix, query]);
  useEffect(() => setCount(named.length + inDocs.length), [named, inDocs]);
  const others = VM_NAMES.filter((n) => n !== ix.vm.name).map((n) => ({ n, total: fuzzysort.go(query, VMS.get(n).entries, { key: 'label', threshold: 0.5 }).length }));
  return html`<div class="results" role="listbox">
    ${named.length + inDocs.length === 0 && html`<div class="none">Nothing in the ${ix.vm.name} VM matches. Names are matched loosely; docs by whole words.</div>`}
    ${named.map(
      (r, i) => html`<a href=${r.obj.href} class=${i === sel ? 'sel' : ''} role="option" aria-selected=${i === sel} onClick=${onPick}>
        ${r.highlight((m) => html`<b>${m}</b>`)}<span class="kind">${KIND_LABEL[r.obj.kind]}</span>
      </a>`,
    )}
    ${inDocs.length > 0 && html`<div class="nav-group">In the docs</div>`}
    ${inDocs.map((r, j) => {
      const i = named.length + j;
      return html`<a href=${r.obj.href} class=${i === sel ? 'sel' : ''} role="option" aria-selected=${i === sel} onClick=${onPick}>
        ${r.obj.label}<span class="kind">${KIND_LABEL[r.obj.kind]}</span>
        <span class="snip"><${Snippet} doc=${r.obj.doc} terms=${r.terms} /></span>
      </a>`;
    })}
    ${others.filter((o) => o.total).map((o) => html`<div class="other">${o.total} names match in the ${o.n} VM. <a href=${`#${o.n}`} style="display:inline;padding:0">Search there</a></div>`)}
  </div>`;
}

// ------------------------------------------------------------------ app

function parseHash() {
  const [vm, scope, ...rest] = decodeURIComponent(location.hash.slice(1)).split('/');
  return { vm: VMS.has(vm) ? vm : VM_NAMES[0], scope: scope || undefined, member: rest.join('/') || undefined };
}

function App() {
  const [route, setRoute] = useState(parseHash);
  const [query, setQuery] = useState('');
  const [sel, setSel] = useState(0);
  const [open, setOpen] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem('api-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  const input = useRef(null);
  const count = useRef(0);
  const ix = VMS.get(route.vm);

  useEffect(() => {
    const on = () => setRoute(parseHash());
    addEventListener('hashchange', on);
    return () => removeEventListener('hashchange', on);
  }, []);
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem('api-theme', theme);
  }, [theme]);
  useEffect(() => {
    const on = (e) => {
      const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
      if ((e.key === '/' && !typing) || (e.key === 'k' && (e.metaKey || e.ctrlKey))) {
        e.preventDefault();
        input.current.focus();
        input.current.select();
      }
    };
    addEventListener('keydown', on);
    return () => removeEventListener('keydown', on);
  }, []);
  // Bring the linked member into view once its page is rendered.
  useEffect(() => {
    const el = route.member && document.getElementById(route.member);
    if (el) {
      const inherited = el.closest('details');
      if (inherited) inherited.open = true;
      el.scrollIntoView({ block: 'start' });
    } else if (!route.member || route.scope === 'types') scrollTo(0, 0);
    const what = route.member ? labelOf(location.hash) : route.scope;
    document.title = `${what ? what + ' · ' : ''}Engine Lua API (${route.vm})`;
  }, [route.vm, route.scope, route.member]);

  const done = () => {
    setQuery('');
    setOpen(false);
    input.current.blur();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') done();
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = count.current || 1;
      setSel((s) => (s + (e.key === 'ArrowDown' ? 1 : n - 1)) % n);
    } else if (e.key === 'Enter') {
      const a = document.querySelector('.results a.sel');
      if (a) {
        location.hash = a.getAttribute('href');
        done();
      }
    }
  };
  useEffect(() => document.querySelector('.results a.sel')?.scrollIntoView({ block: 'nearest' }), [sel]);

  return html`<div class="app">
    <aside class=${`side ${open ? 'open' : ''} ${query ? 'searching' : ''}`}>
      <div class="side-top">
        <div class="brand">
          <a href=${`#${route.vm}`}>Engine Lua API</a>
          <button class="theme" onClick=${() => setTheme(theme === 'dark' ? 'light' : 'dark')}>${theme === 'dark' ? 'Light' : 'Dark'}</button>
        </div>
        <div class="vms" role="group" aria-label="Lua VM">
          ${VM_NAMES.map((n) => html`<button aria-pressed=${String(n === route.vm)} onClick=${() => (location.hash = `#${n}${route.scope && route.scope !== 'types' ? '/' + route.scope : ''}`)}>${n}</button>`)}
        </div>
        <div class="search">
          <input ref=${input} type="search" value=${query} placeholder="Search names and docs" aria-label="Search the API" spellcheck="false" autocomplete="off"
            onInput=${(e) => { setQuery(e.target.value); setSel(0); }} onKeyDown=${onKey} />
          ${!query && html`<kbd>/</kbd>`}
        </div>
        <button class="menu" onClick=${() => setOpen(!open)}>${open ? 'Hide the list' : 'Browse classes'}</button>
      </div>
      <div class="side-body">
        ${query.trim()
          ? html`<${Results} ix=${ix} query=${query.trim()} sel=${sel} setCount=${(n) => (count.current = n)} onPick=${done} />`
          : html`<${Nav} ix=${ix} scope=${route.scope} />`}
      </div>
    </aside>
    <main><${Page} key=${route.vm + '/' + (route.scope || '') + (route.scope === 'types' ? '/' + route.member : '')} ix=${ix} scope=${route.scope} member=${route.member} /></main>
  </div>`;
}

const root = document.getElementById('app');
root.textContent = '';
render(html`<${App} />`, root);
</script>
</body>
</html>
